<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="toriiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2630" />
      <stop offset="50%" stop-color="#141A22" />
      <stop offset="100%" stop-color="#0E1217" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="toriiBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8483A" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#C9A961" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E8483A" stop-opacity="0.5" />
    </linearGradient>

    <!-- Sun Disc Radial Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8483A" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#E8483A" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#E8483A" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow Filter -->
    <filter id="toriiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#E8483A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Card Frame -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#toriiBg)" stroke="url(#toriiBorder)" stroke-width="12" />

  <!-- Background Sun Glow Disc -->
  <circle cx="256" cy="210" r="140" fill="url(#sunGlow)" />
  <circle cx="256" cy="210" r="85" fill="#E8483A" opacity="0.35" />

  <!-- Torii Gate Vector Graphic -->
  <g filter="url(#toriiShadow)">
    <svg x="56" y="56" width="400" height="400" viewBox="0 0 48 48" fill="none">
      <!-- Top Kasagi (Curved Upper Crossbeam) -->
      <path 
        d="M4 10C14 8.5 34 8.5 44 10C45.5 10.2 45.5 12.5 44 13C34 11.5 14 11.5 4 13C2.5 12.5 2.5 10.2 4 10Z" 
        fill="#E8483A"
      />
      <!-- Shimaki (Secondary Upper Beam) -->
      <path 
        d="M7 14H41V16.8H7V14Z" 
        fill="#E8483A" 
      />
      <!-- Gakuzuka (Center Plaque Tablet) -->
      <rect 
        x="22" 
        y="16.8" 
        width="4" 
        height="5.2" 
        rx="0.6" 
        fill="#C9A961"
      />
      <!-- Nuki (Lower Penetrating Crossbeam) -->
      <path 
        d="M5 22H43V24.8H5V22Z" 
        fill="#E8483A" 
      />
      <!-- Left Hashira (Left Pillar) -->
      <path 
        d="M12.5 16.8L11 41H15L16 16.8H12.5Z" 
        fill="#E8483A"
      />
      <!-- Right Hashira (Right Pillar) -->
      <path 
        d="M32 16.8L33 41H37L35.5 16.8H32Z" 
        fill="#E8483A"
      />
      <!-- Left Base Stone (Daiishi) -->
      <rect 
        x="9" 
        y="40" 
        width="7" 
        height="3.2" 
        rx="1" 
        fill="#C9A961" 
      />
      <!-- Right Base Stone (Daiishi) -->
      <rect 
        x="32" 
        y="40" 
        width="7" 
        height="3.2" 
        rx="1" 
        fill="#C9A961" 
      />
    </svg>
  </g>
</svg>
