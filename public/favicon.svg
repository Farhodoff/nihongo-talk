<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glassmorphic Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Card -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="url(#neonGrad)" stroke-width="6" opacity="0.6" filter="url(#glow)" />

  <!-- Graduation Cap Top -->
  <path d="M 256 100 L 416 170 L 256 240 L 96 170 Z" fill="url(#neonGrad)" filter="url(#glow)" />
  <path d="M 160 200 L 160 270 Q 256 320 352 270 L 352 200" fill="none" stroke="url(#neonGrad)" stroke-width="14" stroke-linecap="round" />
  <circle cx="396" cy="180" r="12" fill="#38bdf8" />
  <line x1="396" y1="180" x2="396" y2="260" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <circle cx="396" cy="272" r="16" fill="#c084fc" />

  <!-- Brain Circuits & Synapses -->
  <!-- Left Hemisphere -->
  <path d="M 236 290 Q 150 280 140 340 Q 130 400 200 430 Q 240 440 240 390 Z" fill="none" stroke="url(#neonGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 180 330 Q 210 320 220 360" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />

  <!-- Right Hemisphere -->
  <path d="M 276 290 Q 362 280 372 340 Q 382 400 312 430 Q 272 440 272 390 Z" fill="none" stroke="url(#neonGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 332 330 Q 302 320 292 360" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />

  <!-- Sparkles -->
  <path d="M 100 110 L 108 126 L 124 134 L 108 142 L 100 158 L 92 142 L 76 134 L 92 126 Z" fill="#f59e0b" filter="url(#glow)" />
  <path d="M 400 380 L 406 392 L 418 398 L 406 404 L 400 416 L 394 404 L 382 398 L 394 392 Z" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="256" cy="260" r="14" fill="#ffffff" filter="url(#glow)" />
</svg>
