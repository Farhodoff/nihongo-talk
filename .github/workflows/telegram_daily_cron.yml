name: Daily 22:00 Telegram Telemetry & Dataset Dispatch

on:
  schedule:
    # 17:00 UTC corresponds exactly to 22:00 (10:00 PM) Tashkent Time (UTC+5)
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  dispatch-report:
    name: Run Daily 22:00 Telegram Telemetry Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Telegram Daily Cron Dispatch
        env:
          TELEGRAM_DATASET_BOT_TOKEN: ${{ secrets.TELEGRAM_DATASET_BOT_TOKEN }}
          TELEGRAM_DATASET_CHAT_ID: ${{ secrets.TELEGRAM_DATASET_CHAT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/telegram_daily_cron.cjs
